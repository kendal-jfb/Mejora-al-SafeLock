# SafeLock: logging acotado en todos los servicios. Sin esto, json-file crece sin
# tope en eMMC (contribuye a llenar el disco y al desgaste). Ancla reutilizable.
x-logging: &safelock-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  netalertx:
    container_name: netalertx
    image: jokobsk/netalertx:latest
    network_mode: host
    privileged: true
    restart: unless-stopped
    init: true
    logging: *safelock-logging
    volumes:
      - ./data/config:/data/config
      - ./data/db:/data/db
      - ./data/log:/data/log
      - ./data/api:/data/api
    environment:
      - TZ=America/Costa_Rica
      - PORT=20211

  apprise:
    container_name: apprise
    image: caronc/apprise:latest
    network_mode: host
    restart: unless-stopped
    logging: *safelock-logging

  opencanary:
    container_name: opencanary
    image: cifre/opencanary:latest
    network_mode: host
    restart: unless-stopped
    logging: *safelock-logging
    volumes:
      - ./data/opencanary:/var/log
