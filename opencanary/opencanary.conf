{
    "device.node_id": "CIFRE-Canary",
    "logging.file": "/var/log/opencanary.log",
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {"plain": {"format": "%(message)s"}},
            "handlers": {
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary.log"
                }
            }
        }
    },
    "ftp.enabled": true, "ftp.port": 21,
    "http.enabled": true, "http.port": 8080,
    "ssh.enabled": true, "ssh.port": 2222,
    "telnet.enabled": true, "telnet.port": 2323,
    "mysql.enabled": true, "mysql.port": 3306,
    "rdp.enabled": true, "rdp.port": 3389
}
