# SafeLock: el reloj perdia sincronia ~9 h tras arrancar porque timesyncd resolvia
# los servidores NTP por DNS... que en esta caja ES el propio pihole (dependencia
# circular). Fijamos IPs anycast (Cloudflare) para NO depender del DNS local, con
# los pools por nombre como respaldo. Reloj estable = forense de apagones fiable
# (RTC sin bateria arranca en fecha vieja hasta el primer sync).
[Time]
NTP=162.159.200.1 162.159.200.123
FallbackNTP=pool.ntp.org time.cloudflare.com
