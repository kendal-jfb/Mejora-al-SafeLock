# SafeLock: el RTC NO tiene bateria -> cada arranque en frio parte en 2017 hasta el
# primer sync NTP (lo restaura fake-hwclock y luego NTP corrige). Fijamos IPs NTP
# anycast NUMERICAS para que el sync no dependa de resolucion DNS ni de latencia de
# arranque y sea lo mas robusto posible; los pools por nombre quedan de respaldo.
# Reloj estable = timestamps forenses fiables. (Nota: si la red del cliente bloquea
# UDP/123 el sync fallara igual; eso es politica de red, no de la caja.)
[Time]
NTP=162.159.200.1 162.159.200.123
FallbackNTP=pool.ntp.org time.cloudflare.com
