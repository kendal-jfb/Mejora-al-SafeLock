# SafeLock: p0f imprime CADA conexion a stdout, lo que systemd captura al journal
# (~4800 lineas/hora) y termina escrito a eMMC via ramlog. La evidencia forense ya
# queda en /var/log/p0f.log (flag -o) y en el flight recorder, asi que descartamos
# el stdout: menos escrituras y journal legible.
[Service]
StandardOutput=null
