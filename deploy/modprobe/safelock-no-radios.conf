# SafeLock: appliance headless y CABLEADO. No usa Bluetooth ni WiFi.
# Bloquear estos modulos = menos consumo, menos calor interno y menos superficie
# de ataque. (El WiFi ya no carga en esta imagen; el BT si venia cargado por UART.)
blacklist hci_uart
blacklist btbcm
blacklist btintel
blacklist btqca
blacklist btrtl
blacklist bluetooth
# Aunque una dependencia intente cargarlo, que sea no-op.
install bluetooth /bin/true
install hci_uart /bin/true
