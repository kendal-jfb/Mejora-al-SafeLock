name: Build portal (dist precompilado)

# Construye el portal en CI y versiona portal/dist, para que los equipos NUNCA
# tengan que ejecutar 'npm run build' (evita el pico de RAM/energia que puede
# causar brownout/apagon en las cajas de 4 GB).

on:
  push:
    branches: [ master ]
    paths:
      - 'portal/src/**'
      - 'portal/index.html'
      - 'portal/package.json'
      - 'portal/package-lock.json'
      - 'portal/vite.config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install deps
        working-directory: portal
        run: npm ci

      - name: Build
        working-directory: portal
        run: npm run build

      - name: Commit dist si cambio
        run: |
          if ! git diff --quiet -- portal/dist; then
            git config user.name  "safelock-ci"
            git config user.email "ci@safelock"
            git add portal/dist
            git commit -m "ci: rebuild portal/dist"
            git push
          else
            echo "portal/dist sin cambios"
          fi
